# zizmor configuration.
#
# An entry here is an ACCEPTED finding, not a silenced one: it names the rule,
# the file, and why the obvious remediation is wrong. Anything NOT listed fails
# the job, so a new finding of any kind is still caught.
rules:
  self-repository:
    ignore:
      # zizmor tips: replace in-repo `uses: ./...` references with GitHub's
      # self-repository form, `uses: $/...`, shipped 2026-07-30. actionlint
      # rejects `$/` outright -- "not following the format
      # 'owner/repo/path/to/workflow.yml@ref' nor './path/to/workflow.yml'" --
      # and actionlint is a required check here via 4cloudguru/shared-workflows'
      # workflow-security gate, so the remediation cannot land. Proven, not
      # assumed: the conversion was tried in 4cloudguru/shared-workflows#46,
      # `$/` resolved correctly at runtime, and actionlint plus a pinning gate
      # failed it. Support is requested in rhysd/actionlint#711, still open.
      #
      # Delete these entries once actionlint understands `$/`. Tracked in
      # 4cloudguru/shared-workflows#45.
      - chaos.yml
      - ci.yml
      - fuzz.yml
      - release.yml
      - weekly-security.yml
