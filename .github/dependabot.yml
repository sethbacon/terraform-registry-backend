version: 2

updates:
  # ---------------------------------------------------------------------------
  # Go modules (backend/)
  # ---------------------------------------------------------------------------
  - package-ecosystem: gomod
    directory: /backend
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: UTC
    reviewers:
      - maintainers
    labels:
      - dependencies
      - go
    commit-message:
      prefix: "chore(deps)"
    # Group all Go module updates into a single PR per cycle to reduce noise.
    groups:
      go-dependencies:
        patterns:
          - "*"
    # Ignore major-version bumps for infrastructure libs that require manual review.
    ignore:
      - dependency-name: "github.com/gin-gonic/gin"
        update-types: [ "version-update:semver-major" ]
      - dependency-name: "github.com/golang-migrate/migrate/v4"
        update-types: [ "version-update:semver-major" ]
    cooldown:
      default-days: 7

  # backend/tools/credlifecycle is a SEPARATE Go module (its own go.mod), so the
  # /backend entry above does not see it: Dependabot resolves one manifest per
  # directory and does not recurse into nested modules. It is the repository's
  # first nested module; without this entry its golang.org/x/tools dependency
  # would never be updated and CI would never build it.
  - package-ecosystem: gomod
    directory: /backend/tools/credlifecycle
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: UTC
    reviewers:
      - maintainers
    labels:
      - dependencies
      - go
    commit-message:
      prefix: "chore(deps)"
    groups:
      go-dependencies:
        patterns:
          - "*"
    cooldown:
      default-days: 7

  # ---------------------------------------------------------------------------
  # Docker (backend/)
  # ---------------------------------------------------------------------------
  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: UTC
    reviewers:
      - maintainers
    labels:
      - dependencies
      - docker
    commit-message:
      prefix: "chore(deps)"
    cooldown:
      default-days: 7

  # ---------------------------------------------------------------------------
  # npm (repo root) — pinned doc-generation tooling only (swagger2openapi),
  # not a runtime/shipped dependency. See docs/development.md.
  # ---------------------------------------------------------------------------
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: UTC
    reviewers:
      - maintainers
    labels:
      - dependencies
      - npm
    commit-message:
      prefix: "chore(deps)"
    cooldown:
      default-days: 7

  # ---------------------------------------------------------------------------
  # GitHub Actions
  # ---------------------------------------------------------------------------
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: UTC
    reviewers:
      - maintainers
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: "chore(ci)"
    groups:
      github-actions-dependencies:
        patterns:
          - "*"
    cooldown:
      default-days: 7

  # ---------------------------------------------------------------------------
  # npm (.github/commit-message-check: the parser the PR gate shares with
  # release-please)
  # ---------------------------------------------------------------------------
  # The gate is only meaningful while it parses the way release-please does, so
  # these bumps want checking against release-please's own dependency rather
  # than merging on green.
  - package-ecosystem: npm
    directory: /.github/commit-message-check
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: UTC
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: "chore(ci)"
    groups:
      commit-message-check:
        patterns:
          - "*"
