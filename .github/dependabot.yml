version: 2

updates:
  # ---------------------------------------------------------------------------
  # Go modules (backend/)
  # ---------------------------------------------------------------------------
  - package-ecosystem: gomod
    directory: /backend
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: UTC
    reviewers:
      - maintainers
    labels:
      - dependencies
      - go
    commit-message:
      prefix: "chore(deps)"
    # Group all Go module updates into a single PR per cycle to reduce noise.
    groups:
      go-dependencies:
        patterns:
          - "*"
    # Ignore major-version bumps for infrastructure libs that require manual review.
    ignore:
      - dependency-name: "github.com/gin-gonic/gin"
        update-types: ["version-update:semver-major"]
      - dependency-name: "github.com/golang-migrate/migrate/v4"
        update-types: ["version-update:semver-major"]
    cooldown:
      default-days: 7

  # backend/tools/credlifecycle is a SEPARATE Go module (its own go.mod), so the
  # /backend entry above does not see it: Dependabot resolves one manifest per
  # directory and does not recurse into nested modules. It is the repository's
  # first nested module; without this entry its golang.org/x/tools dependency
  # would never be updated and CI would never build it.
  - package-ecosystem: gomod
    directory: /backend/tools/credlifecycle
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: UTC
    reviewers:
      - maintainers
    labels:
      - dependencies
      - go
    commit-message:
      prefix: "chore(deps)"
    groups:
      go-dependencies:
        patterns:
          - "*"
    cooldown:
      default-days: 7

  # ---------------------------------------------------------------------------
  # Docker (backend/)
  # ---------------------------------------------------------------------------
  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: UTC
    reviewers:
      - maintainers
    labels:
      - dependencies
      - docker
    commit-message:
      prefix: "chore(deps)"
    # Go tags release candidates as `1.27rc2`, with no separator before `rc`.
    # Dependabot's Docker prerelease detection is a heuristic that expects the
    # `-rc1` form, so an RC reads as an ordinary minor bump and gets proposed.
    # Go only ever publishes RCs for a new minor, never for a patch, so
    # declining minor and major here declines every RC while leaving the 1.26.x
    # patch releases -- which is where the security fixes land -- to update on
    # their own. Taking a new Go minor stays a deliberate change.
    ignore:
      - dependency-name: "golang"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
    cooldown:
      default-days: 7

  # ---------------------------------------------------------------------------
  # npm (repo root) — pinned doc-generation tooling only (swagger2openapi),
  # not a runtime/shipped dependency. See docs/development.md.
  # ---------------------------------------------------------------------------
    groups:
      docker-dependencies:
        patterns:
          - '*'
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: UTC
    reviewers:
      - maintainers
    labels:
      - dependencies
      - npm
    commit-message:
      prefix: "chore(deps)"
    cooldown:
      default-days: 7

  # ---------------------------------------------------------------------------
  # GitHub Actions
  # ---------------------------------------------------------------------------
    groups:
      npm-dependencies:
        patterns:
          - '*'
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: UTC
    reviewers:
      - maintainers
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: "chore(deps)"
    groups:
      github-actions-dependencies:
        patterns:
          - "*"
    cooldown:
      default-days: 7

  # ---------------------------------------------------------------------------
  # npm (.github/commit-message-check: the parser the PR gate shares with
  # release-please)
  # ---------------------------------------------------------------------------
  # The gate is only meaningful while it parses the way release-please does, so
  # these bumps want checking against release-please's own dependency rather
  # than merging on green.
  - package-ecosystem: npm
    directory: /.github/commit-message-check
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: UTC
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: "chore(deps)"
    groups:
      commit-message-check:
        patterns:
          - "*"
    # zizmor dependabot-cooldown: the implicit default is 3 days and the audit
    # requires 7. Security updates are exempt from cooldown, so this delays
    # feature bumps and not fixes.
    cooldown:
      default-days: 7
