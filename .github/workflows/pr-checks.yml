name: PR Checks

"on":
  pull_request:
    branches: [main]
    types:
      - opened
      - edited
      - synchronize
      - reopened

jobs:
  conventional-title:
    name: Conventional PR Title
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      # hardening-exception: egress-audit — this job calls the GitHub API;
      #   harden-runner has never run in this repository, so no endpoint baseline
      #   exists and a block policy written without one fails closed on its first run;
      #   audit is what produces that list
      - name: Harden the runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - name: Check PR title follows Conventional Commits
        uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Keep in step with .release-please-config.json's changelog-sections:
          # a type missing here can never be used, and a type missing there
          # merges without cutting a release.
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
            deps
            security
          requireScope: false
          subjectPattern: ^.+$
          subjectPatternError: >-
            The PR title must have a non-empty description after the type
            (e.g. "feat: add login page", not "feat:").

  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      # hardening-exception: egress-audit — this job queries the GitHub advisory API
      #   and clones this repository; harden-runner has never run in this repository,
      #   so no endpoint baseline exists and a block policy written without one fails
      #   closed on its first run; audit is what produces that list
      - name: Harden the runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure


  # ── Breaking-change declarations survive the squash ────
  # This repository squash-merges with
  # squash_merge_commit_message=COMMIT_MESSAGES, so every commit body in a PR
  # is concatenated into ONE merge commit. release-please then keeps only the
  # FIRST `BREAKING CHANGE:` footer of that commit, and reads a `!` marker only
  # from its header. A second declaration anywhere in the PR is therefore
  # dropped in silence: the change ships with no changelog entry, no upgrade
  # note, and nothing failing to say so.
  #
  # WHAT COUNTS is release-please's rule, not the spec's, and the two spellings
  # of the token are NOT symmetric there. Verified against release-please
  # 17.11.1's own parser rather than its documentation: `BREAKING CHANGE:`, with
  # a space, is read only at the START of a line, while the hyphenated spelling
  # is ALSO matched by an unanchored regex over the commit body -- mid-sentence,
  # indented, inside a fenced code block, even inside a longer word -- with the
  # remainder of that line taken as the description.
  #
  # This guard used to count only line-anchored matches, so it UNDER-counted
  # against release-please and passed commits release-please treats as breaking.
  # abacdb5 in azure-pipelines-terraform, the commit that ADDED the guard there,
  # is the case: a sentence in its body NAMING the hyphenated spelling made
  # release-please propose a MAJOR bump over 1.14.4 with a changelog entry
  # reading "` spelling". The guard counted it 0.
  #
  # So the count below is release-please's count -- no more, and no less, since a
  # guard that rejects legitimate prose is one people route around and then
  # delete. On top of it the guard rejects a hyphenated token found off the start
  # of a line at all: that is never a declaration anybody WROTE, and it always
  # buys a major version bump nobody asked for.
  #
  # This is not hypothetical. terraform-registry-backend v4.0.0 shipped two
  # undocumented breaking changes this way -- including one that breaks CI
  # tokens -- and terraform-state-manager-backend 3.1.0 lost three before the
  # release was cut.
  #
  # Splitting the footers across separate commits does not help; the squash
  # concatenates them back. One merged commit can announce exactly one breaking
  # change. Either open one PR per breaking change, or combine them into a
  # single footer and write each up in the upgrade guide.
  #
  # MUTATION-PROVED by backend/internal/ci/breaking_change_footers_test.go,
  # which runs in the required "Backend Tests & Quality" job as part of
  # `go test ./internal/...`. It EXTRACTS the `run:` block below out of this
  # file -- a copy would drift from the thing it claims to prove -- and runs it
  # against fixture commit histories with `gh` stubbed. The script is bash
  # inside YAML: actionlint checks its syntax, zizmor checks the workflow
  # around it, and nothing else ever executes it.
  #
  # That includes the `set -euo pipefail` on its first line, which is not
  # decoration. Without it a failed `gh api` still creates an empty
  # commits.ndjson through the redirect, the loop counts nothing, and this job
  # prints "Breaking-change declarations in this PR: 0" and goes green -- a
  # check that has stopped looking, indistinguishable from a clean PR. Delete
  # the line and the test's fail-closed case is the one that goes red.
  breaking-change-footers:
    name: Breaking-change footers survive the squash
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      # hardening-exception: egress-audit — this job calls the GitHub API;
      #   harden-runner has never run in this repository, so no endpoint baseline
      #   exists and a block policy written without one fails closed on its first run;
      #   audit is what produces that list
      - name: Harden the runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - name: Count breaking-change declarations across this PR's commits
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          gh api --paginate "repos/$REPO/pulls/$PR_NUMBER/commits" \
            --jq '.[] | {sha: .sha[0:7], msg: .commit.message}' > commits.ndjson

          total=0
          report=""
          strays=0
          stray_report=""
          while IFS= read -r line; do
            [ -n "$line" ] || continue
            sha=$(jq -r '.sha' <<<"$line")
            msg=$(jq -r '.msg' <<<"$line")
            subject=$(head -n1 <<<"$msg")

            # release-please recognises the two spellings of the token by
            # DIFFERENT rules, and they are not interchangeable. Verified
            # against release-please 17.11.1's own parser rather than its docs:
            #
            #   `BREAKING CHANGE:`, with a space, counts only where the
            #   Conventional Commits grammar sees a footer -- at the START of a
            #   line, with no leading whitespace. Mid-sentence or indented it is
            #   prose, and release-please ignores it.
            #
            #   The hyphenated spelling counts EVERYWHERE. release-please's
            #   postProcessCommits runs an UNANCHORED regex over the commit body
            #   and takes the rest of the matching line as the description, so it
            #   fires mid-sentence, indented, inside a fenced code block, and
            #   even inside a longer word such as NON-BREAKING-CHANGE:.
            #
            # Both are read out of the BODY, so the same token in the subject
            # line is not a declaration.
            #
            # Counting only line-anchored matches is what let abacdb5 through:
            # a sentence NAMING the hyphenated spelling was read as a real
            # declaration, and release-please proposed a MAJOR bump whose
            # changelog entry was the remainder of that sentence.
            body=$(tail -n +2 <<<"$msg")
            spaced=$(grep -cE '^BREAKING CHANGE:' <<<"$body" || true)
            # Occurrences, not lines. The squash concatenates every body into one
            # and that regex is not global, so a second match on the same line is
            # dropped exactly as surely as one in a later commit.
            hyphenated=$(grep -oF 'BREAKING-CHANGE:' <<<"$body" | grep -c '' || true)
            anchored=$(grep -cE '^BREAKING-CHANGE:' <<<"$body" || true)
            # A hyphenated token anywhere but the start of a line is a
            # declaration nobody WROTE and release-please acts on regardless.
            stray=$((hyphenated - anchored))
            footers=$((spaced + hyphenated))
            if [ "$footers" -gt 0 ]; then
              # A footer wins over the header's `!`, so they are not additive.
              n="$footers"
            elif printf '%s' "$subject" | grep -qE '^[a-zA-Z]+(\([^)]*\))?!:'; then
              n=1
            else
              n=0
            fi

            if [ "$n" -gt 0 ]; then
              report="${report}  ${sha}  ${n} declaration(s)  ${subject}"$'\n'
            fi
            if [ "$stray" -gt 0 ]; then
              strays=$((strays + stray))
              stray_report="${stray_report}  ${sha}  ${stray} off the start of a line  ${subject}"$'\n'
            fi
            total=$((total + n))
          done < commits.ndjson

          echo "Breaking-change declarations in this PR: $total"
          if [ -n "$report" ]; then
            printf 'Where they are:\n%s' "$report"
          fi

          if [ "$strays" -gt 0 ]; then
            printf 'Not written as a footer:\n%s' "$stray_report"
            {
              echo "### A breaking change nobody declared"
              echo
              echo "This pull request carries **$strays** hyphenated breaking-change"
              echo "token(s) somewhere other than the start of a line. release-please"
              echo "matches that spelling ANYWHERE in a commit body -- mid-sentence,"
              echo "indented, inside a fenced code block -- and takes the rest of the"
              echo "line as the description. Prose that merely NAMES the token therefore"
              echo "forces a MAJOR version bump and writes a changelog entry out of the"
              echo "remainder of the sentence."
              echo
              echo '```'
              printf '%s' "$stray_report"
              echo '```'
              echo
              echo "To write ABOUT the token, drop the colon, or use the spaced spelling,"
              echo "which release-please reads only at the start of a line. To declare a"
              echo "real breaking change, put the footer at the start of its own line."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::This PR has $strays breaking-change token(s) off the start of a line; release-please reads each one as a declaration. See the job summary."
            exit 1
          fi

          if [ "$total" -le 1 ]; then
            echo "OK: at most one declaration, so the squash loses nothing."
            exit 0
          fi

          {
            echo "### Breaking-change declarations do not survive the squash"
            echo
            echo "This PR declares **$total** breaking changes. The squash-merge"
            echo "concatenates every commit body into one commit, and release-please"
            echo "keeps only the **first** \`BREAKING CHANGE:\` footer of a commit."
            echo "The other $((total - 1)) would ship with no changelog entry and no notice."
            echo
            echo '```'
            printf '%s' "$report"
            echo '```'
            echo
            echo "Two ways out:"
            echo
            echo "1. **One PR per breaking change.** Preferred when they are independent."
            echo "2. **One footer.** Combine the declarations into a single"
            echo "   \`BREAKING CHANGE:\` footer and write each one up in the upgrade"
            echo "   guide, which is where an operator preparing an upgrade looks."
            echo
            echo "Moving the footers into separate commits within this PR does **not**"
            echo "work -- the squash concatenates them back into one commit body."
          } >> "$GITHUB_STEP_SUMMARY"

          echo "::error::This PR declares $total breaking changes; the squash keeps only the first. See the job summary."
          exit 1

  # ── The merged commit has to be readable by release-please ─────────────
  # release-please chooses what to release by parsing the commits on main
  # with a strict reading of the Conventional Commits grammar. A message it
  # cannot parse is not an error to it: it logs `commit could not be parsed`
  # at debug level, reports success, and drops the commit. That change then
  # gets no changelog entry and no version bump, and never will -- every
  # later run re-reads the same commit and skips it again.
  #
  # This is not hypothetical. terraform-state-manager-backend#405, a
  # dependency migration that cleared seven advisories, merged with a body
  # line that happened to begin with `WithArgs(pq.Array(...))`. The grammar
  # reads a line starting with `name(` as a structured token, so its
  # brackets have to be flat and closed, and nested ones void the whole
  # commit. The same text one word further along the line is ordinary prose
  # and parses cleanly. Whether that release got cut came down to where the
  # paragraph wrapped.
  #
  # Its sibling repository made the identical change and released normally,
  # on the same config and the same action version. Nothing in CI could tell
  # the two apart, because a PR title check reads only the title and both
  # titles were correct.
  release-please-can-read-the-commit:
    name: release-please can read the merged commit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      # hardening-exception: egress-audit — this job installs from the npm registry,
      #   calls the GitHub API, and clones this repository; harden-runner has never
      #   run in this repository, so no endpoint baseline exists and a block policy
      #   written without one fails closed on its first run; audit is what produces
      #   that list
      - name: Harden the runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the parser release-please uses
        working-directory: .github/commit-message-check
        # --ignore-scripts: the only dependency is @conventional-commits/parser,
        # which declares no install hooks, so nothing is lost by refusing to run
        # dependency scripts.
        run: npm ci --ignore-scripts

      - name: Parse the commit this PR would squash into main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          gh api --paginate "repos/$REPO/pulls/$PR_NUMBER/commits" \
            --jq '.[] | {sha: .sha, message: .commit.message, parents: (.parents | length)}' \
            > commits.ndjson

          node .github/commit-message-check/verify.mjs commits.ndjson
