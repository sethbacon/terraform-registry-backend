name: PR Checks

"on":
  pull_request:
    branches: [main]
    types:
      - opened
      - edited
      - synchronize
      - reopened

jobs:
  conventional-title:
    name: Conventional PR Title
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      # hardening-exception: egress-audit — this job calls the GitHub API;
      #   harden-runner has never run in this repository, so no endpoint baseline
      #   exists and a block policy written without one fails closed on its first run;
      #   audit is what produces that list
      - name: Harden the runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - name: Check PR title follows Conventional Commits
        uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Keep in step with .release-please-config.json's changelog-sections:
          # a type missing here can never be used, and a type missing there
          # merges without cutting a release.
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
            deps
            security
          requireScope: false
          subjectPattern: ^.+$
          subjectPatternError: >-
            The PR title must have a non-empty description after the type
            (e.g. "feat: add login page", not "feat:").

  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      # hardening-exception: egress-audit — this job queries the GitHub advisory API
      #   and clones this repository; harden-runner has never run in this repository,
      #   so no endpoint baseline exists and a block policy written without one fails
      #   closed on its first run; audit is what produces that list
      - name: Harden the runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure


  # ── Breaking-change declarations survive the squash ────
  # This repository squash-merges with
  # squash_merge_commit_message=COMMIT_MESSAGES, so every commit body in a PR
  # is concatenated into ONE merge commit. release-please then keeps only the
  # FIRST `BREAKING CHANGE:` footer of that commit, and reads a `!` marker only
  # from its header. A second declaration anywhere in the PR is therefore
  # dropped in silence: the change ships with no changelog entry, no upgrade
  # note, and nothing failing to say so.
  #
  # WHAT COUNTS is release-please's rule, not the spec's, and the two spellings
  # of the token are NOT symmetric there. Verified against release-please
  # 17.11.1's own parser rather than its documentation: `BREAKING CHANGE:`, with
  # a space, is read only at the START of a line, while the hyphenated spelling
  # is ALSO matched by an unanchored regex over the commit body -- mid-sentence,
  # indented, inside a fenced code block, even inside a longer word -- with the
  # remainder of that line taken as the description.
  #
  # This guard used to count only line-anchored matches, so it UNDER-counted
  # against release-please and passed commits release-please treats as breaking.
  # abacdb5 in azure-pipelines-terraform, the commit that ADDED the guard there,
  # is the case: a sentence in its body NAMING the hyphenated spelling made
  # release-please propose a MAJOR bump over 1.14.4 with a changelog entry
  # reading "` spelling". The guard counted it 0.
  #
  # So the count below is release-please's count -- no more, and no less, since a
  # guard that rejects legitimate prose is one people route around and then
  # delete. On top of it the guard rejects a hyphenated token found off the start
  # of a line at all: that is never a declaration anybody WROTE, and it always
  # buys a major version bump nobody asked for.
  #
  # This is not hypothetical. terraform-registry-backend v4.0.0 shipped two
  # undocumented breaking changes this way -- including one that breaks CI
  # tokens -- and terraform-state-manager-backend 3.1.0 lost three before the
  # release was cut.
  #
  # Splitting the footers across separate commits does not help; the squash
  # concatenates them back. One merged commit can announce exactly one breaking
  # change. Either open one PR per breaking change, or combine them into a
  # single footer and write each up in the upgrade guide.
  #
  # MUTATION-PROVED, but no longer here. The guard was a 128-line shell body
  # duplicated across NINE repositories -- which is why one regex mistake existed
  # in nine places at once and took nine pull requests to correct -- so it now
  # lives once as a composite action in 4cloudguru/shared-workflows, with its
  # 16-case test beside it in that repository's self-check.
  #
  # The test still EXTRACTS the script from the action rather than copying it: a
  # copy drifts from the thing it claims to prove, which is the same defect one
  # level up.
  #
  # This stays a composite action called as a STEP rather than a reusable
  # workflow, so the job keeps its name and this check keeps reporting as
  # "Breaking-change footers survive the squash". A reusable workflow reports as
  # <caller-job-id> / <called-job-name>, and this context is required in
  # azure-pipelines-release-docs.
  #
  # That includes the `set -euo pipefail` on its first line, which is not
  # decoration. Without it a failed `gh api` still creates an empty
  # commits.ndjson through the redirect, the loop counts nothing, and this job
  # prints "Breaking-change declarations in this PR: 0" and goes green -- a
  # check that has stopped looking, indistinguishable from a clean PR. Delete
  # the line and the test's fail-closed case is the one that goes red.
  breaking-change-footers:
    name: Breaking-change footers survive the squash
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      # hardening-exception: egress-audit — this job calls the GitHub API;
      #   harden-runner has never run in this repository, so no endpoint baseline
      #   exists and a block policy written without one fails closed on its first run;
      #   audit is what produces that list
      - name: Harden the runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      # The guard is 128 lines of shell that was duplicated across NINE
      # repositories, which is why one regex mistake existed in nine places at
      # once and took nine pull requests to correct. It now lives once, in
      # 4cloudguru/shared-workflows, with its test beside it.
      #
      # A composite ACTION, not a reusable workflow: a reusable workflow reports
      # as <caller-job-id> / <called-job-name>, which would rename this check.
      # Called as a step, the job keeps its name and the context keeps reporting
      # as "Breaking-change footers survive the squash", so no branch protection
      # moves.
      - name: Count breaking-change declarations across this PR's commits
        uses: 4cloudguru/shared-workflows/.github/actions/breaking-change-footers@9276df8e0bdb3152e2529ab98c8b99cfb9e22d4b # v1.13.0
        with:
          gh-token: ${{ secrets.GITHUB_TOKEN }}
          pr-number: ${{ github.event.pull_request.number }}
          repo: ${{ github.repository }}
  release-please-can-read-the-commit:
    name: release-please can read the merged commit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      # hardening-exception: egress-audit — this job installs from the npm registry,
      #   calls the GitHub API, and clones this repository; harden-runner has never
      #   run in this repository, so no endpoint baseline exists and a block policy
      #   written without one fails closed on its first run; audit is what produces
      #   that list
      - name: Harden the runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the parser release-please uses
        working-directory: .github/commit-message-check
        # --ignore-scripts: the only dependency is @conventional-commits/parser,
        # which declares no install hooks, so nothing is lost by refusing to run
        # dependency scripts.
        run: npm ci --ignore-scripts

      - name: Parse the commit this PR would squash into main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          gh api --paginate "repos/$REPO/pulls/$PR_NUMBER/commits" \
            --jq '.[] | {sha: .sha, message: .commit.message, parents: (.parents | length)}' \
            > commits.ndjson

          node .github/commit-message-check/verify.mjs commits.ndjson
