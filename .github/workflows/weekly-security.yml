name: Weekly Security Scan

on:
  schedule:
    - cron: "0 8 * * 1" # Every Monday 08:00 UTC
  workflow_dispatch: {}
  # osv-scan and govulncheck also run per-PR/push (#563) so vulnerable
  # dependencies are caught before merge instead of surfacing up to a week
  # later; ci/codeql/stale-dependabot below stay schedule/dispatch-only since
  # ci.yml already runs its own CodeQL analysis per push/PR.
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: weekly-security-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  # The workflow-level block is a CEILING, not a default: a job may narrow it
  # but never widen it, and a job asking for more than this fails the whole
  # workflow at STARTUP with zero jobs run. Setting contents: read here while
  # the ci job requested contents: write did exactly that.
  #
  # So this is the union of what the jobs below request, stated explicitly, and
  # each job still narrows to its own needs. That is strictly better than
  # omitting the block, which falls back to the repository default.
  contents: write
  issues: write
  pull-requests: write
  security-events: write

jobs:
  ci:
    name: CI
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    # Not `secrets: inherit`, which hands the called workflow EVERY secret this
    # repository holds regardless of what it uses. ci.yml references exactly one
    # (GIST_TOKEN, for the coverage badge); GITHUB_TOKEN is ambient and is not
    # passed through this block.
    secrets:
      GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
    # Explicit, because this job CALLS ci.yml and a called workflow's jobs are
    # capped by what the caller grants. This is the union ci.yml's own jobs
    # declare (swagger-docs-sync contents+pull-requests, gosec issues, codeql
    # security-events); without it, the workflow-level contents: read below
    # would silently starve them.
    permissions:
      contents: write
      pull-requests: write
      issues: write
      security-events: write
    uses: ./.github/workflows/ci.yml

  # ── OSV Vulnerability Scan ────────────────────────────
  # Runs on every push/PR (#563) in addition to the weekly cron, so a newly
  # introduced vulnerable dependency fails the PR instead of waiting for the
  # next scheduled run.
  osv-scan:
    name: OSV Vulnerability Scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write
    steps:
      # hardening-exception: egress-audit — this job queries the OSV vulnerability
      #   database, calls the GitHub API, and clones this repository; harden-runner
      #   has never run in this repository, so no endpoint baseline exists and a block
      #   policy written without one fails closed on its first run; audit is what
      #   produces that list
      - name: Harden the runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run OSV-Scanner
        id: osv
        # THE SHARED ACTION, NOT THE OFFICIAL ONE, AND NO continue-on-error (#894).
        #
        # It performs the same invocation — same image, same workspace mount and
        # working directory, same argument convention, same GOTOOLCHAIN — and
        # additionally reports the exit code the scanner actually returned.
        #
        # continue-on-error is gone because it was the defect. It collapsed exit
        # 1 ("vulnerabilities found") and the error exits into one `outcome`, and
        # rewrote the failed step's `conclusion` to `success`, so a scanner that
        # had stopped working produced exactly the same run record as a clean
        # one — which is how a scan that exited 127 filed an issue asserting
        # vulnerabilities that did not exist while seven reachable advisories
        # stayed invisible, with every field of that run reading `success`.
        #
        # What replaces it: findings do NOT fail this step, so an advisory with
        # no published fix still cannot pin a required check red, and the triage
        # steps below decide on `outputs.findings` instead of on `outcome`. A
        # scanner ERROR does fail it, immediately and loudly, which is the state
        # that previously looked identical to clean.
        uses: 4cloudguru/shared-workflows/.github/actions/osv-scan@a53b685c1f50255e5bc7061b6080d2456351b9be # v1.18.0
        with:
          # JSON (not table) so the triage step below can tell an advisory
          # with a published fix from one without; the triage step prints a
          # human-readable summary in its place.
          #
          # --no-call-analysis=go is deliberate, and is required for this job to
          # be able to report success at all.
          #
          # The scanner image is built FROM a golang base, so it carries exactly
          # one Go toolchain, and the official golang images set
          # GOTOOLCHAIN=local — which forbids downloading or switching to
          # another. It therefore cannot build a module whose `go` directive
          # names a newer release, and backend/go.mod is one. Its internal
          # call-analysis pass then aborts and osv-scanner exits 127 — its ERROR
          # code, distinct from the exit 1 that means "vulnerabilities found".
          #
          # RE-MEASURED 2026-08-27 at the pin above, v2.5.1, the newest release,
          # by pulling ghcr.io/google/osv-scanner-action:v2.5.1 and running the
          # real scanner: the image reports go1.26.5 while this module declares
          # go 1.26.6, and the pass aborts with
          #   "go.mod requires go >= 1.26.6 (running go 1.26.5; GOTOOLCHAIN=local)"
          # exiting 127 with an EMPTY results array. The same invocation with
          # this flag exits 0 and prints no abort. The previous note here said
          # go1.26.2 in v2.3.8; that was true of a pin no longer in use, and the
          # numbers moved without the conclusion changing.
          #
          # A NEWER PIN DOES NOT FIX THIS AND CANNOT: the image will always trail
          # the toolchain this module builds on. A GOTOOLCHAIN=auto override was
          # also measured and does work, and is deliberately not adopted — it
          # duplicates the govulncheck job below at an older govulncheck, makes a
          # hermetic scan depend on fetching and executing a toolchain at scan
          # time inside a root container, and returns to exit 127 with an empty
          # report whenever that fetch fails.
          #
          # That abort has been happening on every run, masked: exit 1 wins
          # whenever any finding exists, and this repo always had one, namely
          # GO-2026-5932. Now that backend/osv-scanner.toml suppresses it, the
          # abort would have surfaced as a permanent exit 127 — swapping a
          # detector that is red for a known reason for one that is red for a
          # hidden reason.
          #
          # Nothing is lost. Reachability is the `govulncheck` job's
          # responsibility below, and that job resolves its toolchain from
          # backend/go.mod, so it always matches the module. This step keeps
          # doing the flat known-vulnerability sweep of go.mod/go.sum, which
          # needs no toolchain at all. osv_triage.py never read the analysis
          # field, so no reporting here loses information — unlike the sibling
          # repos, this job never claimed reachability it had not computed.
          #
          # THE PAIRING IS NOW GATED, not merely described. The replay signature
          # `osv-reachability-delegation` asserts, on every push and pull request
          # and daily, that this flag stays paired with a govulncheck job that
          # covers backend/go.mod, reads its toolchain from backend/go.mod, and
          # has its result consumed rather than swallowed. Removing either half
          # fails the signature-replay check.
          scan-args: |-
            --recursive
            ./backend
            --no-call-analysis=go
            --format=json
            --output=osv-results.json

      # Triage the weekly run too, so the issue below is filed on the same
      # basis the PR gate uses (issue #776). Previously the weekly path
      # ignored osv_triage.py entirely: it filed an issue for ANY finding,
      # with a body that named none of them and pointed at logs that expire.
      # An advisory with no published fix therefore reopened a fresh,
      # contentless issue every single week.
      #
      # continue-on-error so an unfixable finding still records the report and
      # leaves the weekly run green; the exit status is read below.
      - name: Triage findings (weekly)
        id: osv_triage_weekly
        # `outputs.findings`, not `outcome`. Findings no longer fail the scan
        # step, so its outcome is `success` on a run that found something — and
        # a scanner error no longer reaches here at all, because it fails the
        # job outright rather than arriving disguised as a finding.
        if: steps.osv.outputs.findings == 'true' && github.event_name == 'schedule'
        continue-on-error: true
        run: python3 backend/scripts/osv_triage.py osv-results.json --scanner-failed --issue-body osv-report.md

      - name: Create issue on new vulnerabilities
        # Only when something is actually actionable — osv_triage.py exits
        # non-zero exclusively for advisories with a published fixed version.
        # Unfixable findings are still reported: the triage step writes them to
        # the job summary as warnings, and the govulncheck job covers whether
        # they are reachable.
        if: steps.osv_triage_weekly.outcome == 'failure'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const title = `OSV-Scanner: fixable vulnerabilities found — ${new Date().toISOString().slice(0,10)}`;
            // The report names each advisory, the package and version we
            // actually depend on, and the version it is fixed in — so the
            // issue stays actionable after the workflow logs expire.
            const report = fs.readFileSync('osv-report.md', 'utf8');
            const body = [
              report,
              '',
              `**Workflow run:** ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            ].join('\n');

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['security', 'dependencies'],
            });

      - name: Triage findings — fail only when a fix is published
        # continue-on-error above keeps the weekly run green (it reports via
        # the issue instead); per-PR/push runs gate the merge, but only on
        # advisories that can actually be acted on. OSV-Scanner exits non-zero
        # for ANY known vulnerability, including ones with no released fix —
        # gating on those would pin the check red until upstream ships,
        # regardless of what the PR changed, and a permanently-red required
        # check is one everybody learns to ignore. Findings with no fix are
        # surfaced as warnings + job summary instead (and the govulncheck job
        # covers whether they're actually reachable).
        if: steps.osv.outputs.findings == 'true' && github.event_name != 'schedule'
        run: python3 backend/scripts/osv_triage.py osv-results.json --scanner-failed

  # ── govulncheck (reachability-aware scan) ─────────────
  # OSV-Scanner flags every known-vulnerable version in go.sum regardless of whether
  # this binary actually calls the vulnerable code path. govulncheck performs
  # call-graph reachability analysis so genuinely exploitable findings aren't lost
  # in the noise of unreachable transitive-dependency CVEs.
  # Runs on every push/PR (#563) in addition to the weekly cron, so a newly
  # introduced reachable vulnerability fails the PR instead of waiting for
  # the next scheduled run.
  govulncheck:
    name: govulncheck (reachability scan)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write
    steps:
      # hardening-exception: egress-audit — this job downloads the Go vulnerability
      #   database and the govulncheck tool, downloads Go modules and tools from the
      #   module proxy, and calls the GitHub API; harden-runner has never run in this
      #   repository, so no endpoint baseline exists and a block policy written
      #   without one fails closed on its first run; audit is what produces that list
      - name: Harden the runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go toolchain
        uses: ./.github/actions/setup-backend

      - name: Install govulncheck
        uses: 4cloudguru/shared-workflows/.github/actions/go-install@3dac549c7e4fe4a0dc54aaf9ed187b6da2c6eab9 # v1.15.0
        with:
          package: golang.org/x/vuln/cmd/govulncheck@v1.1.4

      - name: Run govulncheck
        id: govulncheck
        working-directory: backend
        continue-on-error: true
        run: govulncheck -format json ./... > govulncheck-results.json

      # Triaged on the same basis as the osv-scan job above: a reachable
      # advisory with no published fix cannot be acted on, so it reports
      # instead of gating. continue-on-error so the weekly run stays green;
      # the exit status is read below.
      - name: Triage findings (weekly)
        id: govulncheck_triage_weekly
        if: github.event_name == 'schedule'
        working-directory: backend
        continue-on-error: true
        run: python3 scripts/govulncheck_triage.py govulncheck-results.json --issue-body ../govulncheck-report.md

      - name: Create issue on new vulnerabilities
        # Only when something is actually actionable — govulncheck_triage.py
        # exits non-zero exclusively for reachable advisories with a published
        # fixed version. Unfixable ones still reach the job summary as
        # warnings.
        if: steps.govulncheck_triage_weekly.outcome == 'failure'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const title = `govulncheck: fixable reachable vulnerabilities found — ${new Date().toISOString().slice(0,10)}`;
            // The report names each advisory, the module and version we
            // actually depend on, and the version it is fixed in — so the
            // issue stays actionable after the workflow logs expire.
            const report = fs.readFileSync('govulncheck-report.md', 'utf8');
            const body = [
              report,
              '',
              `**Workflow run:** ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            ].join('\n');

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['security', 'dependencies'],
            });

      - name: Triage findings — fail only when a fix is published
        # Per-PR/push runs gate the merge, but only on advisories that can
        # actually be acted on. govulncheck exits non-zero for ANY reachable
        # vulnerability, including ones with no released fix — gating on those
        # would pin the check red until upstream ships, regardless of what the
        # PR changed, and a permanently-red required check is one everybody
        # learns to ignore. Findings with no fix are surfaced as warnings +
        # job summary instead.
        if: github.event_name != 'schedule'
        working-directory: backend
        run: python3 scripts/govulncheck_triage.py govulncheck-results.json

  # ── CodeQL Analysis ───────────────────────────────────
  codeql:
    name: CodeQL Analysis (Go)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Schedule/dispatch only — ci.yml already runs CodeQL on every push/PR,
    # and GitHub code scanning rejects concurrent analyses for the same
    # ref/category, so this stays the weekly defense-in-depth backstop.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      security-events: write
    steps:
      # hardening-exception: egress-audit — this job downloads the CodeQL bundle and
      #   its query packs, downloads Go modules and tools from the module proxy, and
      #   clones this repository; harden-runner has never run in this repository, so
      #   no endpoint baseline exists and a block policy written without one fails
      #   closed on its first run; audit is what produces that list
      - name: Harden the runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go toolchain
        uses: ./.github/actions/setup-backend

      - name: Initialize CodeQL
        uses: github/codeql-action/init@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          languages: go

      - name: Build for CodeQL
        working-directory: backend
        run: go build ./...

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          category: /language:go

  stale-dependabot:
    name: Flag stale Dependabot PRs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Schedule/dispatch only — "stale" is a weekly-cadence concept, not
    # something to re-evaluate on every push/PR.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    permissions:
      pull-requests: write
    steps:
      # hardening-exception: egress-audit — this job calls the GitHub API;
      #   harden-runner has never run in this repository, so no endpoint baseline
      #   exists and a block policy written without one fails closed on its first run;
      #   audit is what produces that list
      - name: Harden the runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - name: Label PRs open > 14 days
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --author "app/dependabot" \
            --state open \
            --json number,createdAt,title \
            --jq '.[] | select((.createdAt | fromdateiso8601) < (now - 1209600)) | .number' \
          | xargs -r -I{} gh pr edit {} \
              --repo "$GITHUB_REPOSITORY" \
              --add-label "stale-security-patch" || true

  notify-on-failure:
    name: Create issue on failure
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [ci, osv-scan, govulncheck, codeql, stale-dependabot]
    if: failure() && github.event_name == 'schedule'
    permissions:
      issues: write
    steps:
      # hardening-exception: egress-audit — this job downloads the Go vulnerability
      #   database and the govulncheck tool and calls the GitHub API; harden-runner
      #   has never run in this repository, so no endpoint baseline exists and a block
      #   policy written without one fails closed on its first run; audit is what
      #   produces that list
      - name: Harden the runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - name: Create failure issue
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const title = `Scheduled build failed — ${new Date().toISOString().slice(0,10)}`;
            const body = [
              '## Scheduled Build Failure',
              '',
              `**Workflow run:** ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              '',
              'The weekly security scan failed. Please investigate and fix before the next release.',
              '',
              'Common causes:',
              '- A transitive Go dependency published a breaking change',
              '- The Docker base image changed in a breaking way',
              '- A gosec or OSV finding was introduced',
              '- CodeQL detected a new code quality issue',
            ].join('\n');

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['bug', 'ci'],
            });
