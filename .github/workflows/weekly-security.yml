name: Weekly Security Scan

on:
  schedule:
    - cron: "0 8 * * 1" # Every Monday 08:00 UTC
  workflow_dispatch: {}
  # osv-scan and govulncheck also run per-PR/push (#563) so vulnerable
  # dependencies are caught before merge instead of surfacing up to a week
  # later; ci/codeql/stale-dependabot below stay schedule/dispatch-only since
  # ci.yml already runs its own CodeQL analysis per push/PR.
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: weekly-security-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    secrets: inherit
    uses: ./.github/workflows/ci.yml

  # ── OSV Vulnerability Scan ────────────────────────────
  # Runs on every push/PR (#563) in addition to the weekly cron, so a newly
  # introduced vulnerable dependency fails the PR instead of waiting for the
  # next scheduled run.
  osv-scan:
    name: OSV Vulnerability Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Run OSV-Scanner
        id: osv
        uses: google/osv-scanner-action/osv-scanner-action@9a498708959aeaef5ef730655706c5a1df1edbc2 # v2.3.8
        continue-on-error: true
        with:
          # JSON (not table) so the triage step below can tell an advisory
          # with a published fix from one without; the triage step prints a
          # human-readable summary in its place.
          scan-args: |-
            --recursive
            ./backend
            --format=json
            --output=osv-results.json

      - name: Create issue on new vulnerabilities
        # Issue creation stays weekly-only to avoid opening a new issue on
        # every PR push; per-PR runs fail the job instead (next step).
        if: steps.osv.outcome == 'failure' && github.event_name == 'schedule'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const title = `OSV-Scanner: vulnerabilities found — ${new Date().toISOString().slice(0,10)}`;
            const body = [
              '## OSV-Scanner Vulnerability Report',
              '',
              `**Workflow run:** ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              '',
              'OSV-Scanner found known vulnerabilities in `go.sum`. Please review the workflow logs and update affected dependencies.',
            ].join('\n');

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['security', 'dependencies'],
            });

      - name: Triage findings — fail only when a fix is published
        # continue-on-error above keeps the weekly run green (it reports via
        # the issue instead); per-PR/push runs gate the merge, but only on
        # advisories that can actually be acted on. OSV-Scanner exits non-zero
        # for ANY known vulnerability, including ones with no released fix —
        # gating on those would pin the check red until upstream ships,
        # regardless of what the PR changed, and a permanently-red required
        # check is one everybody learns to ignore. Findings with no fix are
        # surfaced as warnings + job summary instead (and the govulncheck job
        # covers whether they're actually reachable).
        if: steps.osv.outcome == 'failure' && github.event_name != 'schedule'
        run: python3 backend/scripts/osv_triage.py osv-results.json

  # ── govulncheck (reachability-aware scan) ─────────────
  # OSV-Scanner flags every known-vulnerable version in go.sum regardless of whether
  # this binary actually calls the vulnerable code path. govulncheck performs
  # call-graph reachability analysis so genuinely exploitable findings aren't lost
  # in the noise of unreachable transitive-dependency CVEs.
  # Runs on every push/PR (#563) in addition to the weekly cron, so a newly
  # introduced reachable vulnerability fails the PR instead of waiting for
  # the next scheduled run.
  govulncheck:
    name: govulncheck (reachability scan)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Set up Go toolchain
        uses: ./.github/actions/setup-backend

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.1.4

      - name: Run govulncheck
        id: govulncheck
        working-directory: backend
        continue-on-error: true
        run: govulncheck ./...

      - name: Create issue on new vulnerabilities
        # Issue creation stays weekly-only to avoid opening a new issue on
        # every PR push; per-PR runs fail the job instead (next step).
        if: steps.govulncheck.outcome == 'failure' && github.event_name == 'schedule'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const title = `govulncheck: reachable vulnerabilities found — ${new Date().toISOString().slice(0,10)}`;
            const body = [
              '## govulncheck Vulnerability Report',
              '',
              `**Workflow run:** ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              '',
              'govulncheck found known vulnerabilities that are reachable from this codebase (call-graph analysis). Please review the workflow logs and update affected dependencies.',
            ].join('\n');

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['security', 'dependencies'],
            });

      - name: Fail job on push/PR when vulnerabilities found
        # continue-on-error above keeps the weekly run green (it reports via
        # the issue instead); per-PR/push runs must actually fail so this
        # can be a required check gating the merge.
        if: steps.govulncheck.outcome == 'failure' && github.event_name != 'schedule'
        run: exit 1

  # ── CodeQL Analysis ───────────────────────────────────
  codeql:
    name: CodeQL Analysis (Go)
    runs-on: ubuntu-latest
    # Schedule/dispatch only — ci.yml already runs CodeQL on every push/PR,
    # and GitHub code scanning rejects concurrent analyses for the same
    # ref/category, so this stays the weekly defense-in-depth backstop.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Set up Go toolchain
        uses: ./.github/actions/setup-backend

      - name: Initialize CodeQL
        uses: github/codeql-action/init@dc73d59c2d7bd4f8194098a91219eeee6d8a1719 # v4
        with:
          languages: go

      - name: Build for CodeQL
        working-directory: backend
        run: go build ./...

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@dc73d59c2d7bd4f8194098a91219eeee6d8a1719 # v4
        with:
          category: /language:go

  stale-dependabot:
    name: Flag stale Dependabot PRs
    runs-on: ubuntu-latest
    # Schedule/dispatch only — "stale" is a weekly-cadence concept, not
    # something to re-evaluate on every push/PR.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    permissions:
      pull-requests: write
    steps:
      - name: Label PRs open > 14 days
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --author "app/dependabot" \
            --state open \
            --json number,createdAt,title \
            --jq '.[] | select((.createdAt | fromdateiso8601) < (now - 1209600)) | .number' \
          | xargs -r -I{} gh pr edit {} \
              --repo "$GITHUB_REPOSITORY" \
              --add-label "stale-security-patch" || true

  notify-on-failure:
    name: Create issue on failure
    runs-on: ubuntu-latest
    needs: [ci, osv-scan, govulncheck, codeql, stale-dependabot]
    if: failure() && github.event_name == 'schedule'
    permissions:
      issues: write
    steps:
      - name: Create failure issue
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const title = `Scheduled build failed — ${new Date().toISOString().slice(0,10)}`;
            const body = [
              '## Scheduled Build Failure',
              '',
              `**Workflow run:** ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              '',
              'The weekly security scan failed. Please investigate and fix before the next release.',
              '',
              'Common causes:',
              '- A transitive Go dependency published a breaking change',
              '- The Docker base image changed in a breaking way',
              '- A gosec or OSV finding was introduced',
              '- CodeQL detected a new code quality issue',
            ].join('\n');

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['bug', 'ci'],
            });
