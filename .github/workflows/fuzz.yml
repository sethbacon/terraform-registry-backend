name: Fuzz Tests

on:
  schedule:
    # Run every night at 02:17 UTC. Off-peak time; avoids :00/:30 pile-up.
    - cron: "17 2 * * *"
  workflow_dispatch: {}

permissions:
  # This is a CEILING, not a default: a job may narrow it, never widen it, and a
  # job asking for more fails the whole workflow at startup. issues: write has to
  # stay here because fuzz-failure-issue needs it.
  #
  # What changed is that the `fuzz` job now narrows to contents: read explicitly,
  # so it no longer receives issues: write just by inheriting. It runs fuzz
  # corpora and has no business filing issues.
  contents: read
  issues: write

jobs:
  fuzz:
    name: Fuzz — ${{ matrix.target }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        include:
          - target: FuzzAnalyzeArchive
            package: ./internal/analyzer/...
          - target: FuzzParseDelivery-github
            package: ./internal/scm/github/...
            fuzz_name: FuzzParseDelivery
          - target: FuzzParseDelivery-gitlab
            package: ./internal/scm/gitlab/...
            fuzz_name: FuzzParseDelivery
          - target: FuzzParseDelivery-bitbucket
            package: ./internal/scm/bitbucket/...
            fuzz_name: FuzzParseDelivery
          - target: FuzzParseDelivery-azuredevops
            package: ./internal/scm/azuredevops/...
            fuzz_name: FuzzParseDelivery

    steps:
      # hardening-exception: egress-audit — this job downloads Go modules and tools
      #   from the module proxy, transfers artifacts through the Actions API, and
      #   clones this repository; harden-runner has never run in this repository, so
      #   no endpoint baseline exists and a block policy written without one fails
      #   closed on its first run; audit is what produces that list
      - name: Harden the runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go toolchain
        uses: ./.github/actions/setup-backend

      - name: Determine fuzz target name
        id: target
        run: |
          if [ -n "${{ matrix.fuzz_name }}" ]; then
            echo "name=${{ matrix.fuzz_name }}" >> $GITHUB_OUTPUT
          else
            echo "name=${{ matrix.target }}" >> $GITHUB_OUTPUT
          fi

      - name: Run fuzz target for 10 minutes
        working-directory: backend
        # -timeout must exceed -fuzztime. Go's default test timeout is also
        # 10m, so with -fuzztime=10m and no -timeout the binary's deadline
        # expires at the exact moment fuzzing exhausts its budget: the job
        # then fails with "context deadline exceeded" *because* the target
        # survived, i.e. it failed whenever it succeeded, and filed a
        # crash-artifact issue with no crash artifact (issue #703). The extra
        # 5m covers corpus loading, seed replay, and shutdown.
        run: |
          go test ${{ matrix.package }} \
            -run='^$' \
            -fuzz=${STEPS_TARGET_OUTPUTS_NAME} \
            -fuzztime=10m \
            -timeout=15m \
            -v
        env:
          STEPS_TARGET_OUTPUTS_NAME: ${{ steps.target.outputs.name }}

      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-crash-${{ matrix.target }}
          path: |
            backend/**/testdata/fuzz/**
          retention-days: 30

  fuzz-failure-issue:
    name: Open issue on fuzz failure
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: fuzz
    if: failure() && github.event_name == 'schedule'
    permissions:
      issues: write
    steps:
      # hardening-exception: egress-audit — this job downloads Go modules and tools
      #   from the module proxy and calls the GitHub API; harden-runner has never run
      #   in this repository, so no endpoint baseline exists and a block policy
      #   written without one fails closed on its first run; audit is what produces
      #   that list
      - name: Harden the runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - name: Create issue
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const title = `Fuzz failure detected — ${new Date().toISOString().slice(0, 10)}`;
            const body = [
              '## Fuzz test failure',
              '',
              `A nightly fuzz run failed. See the [workflow run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}) for crash artifacts.`,
              '',
              '**Action required:** download the crash artifact, reproduce with `go test -run=FuzzXxx/testdata/fuzz/FuzzXxx/<filename>`, and fix the underlying bug.',
            ].join('\n');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['bug', 'fuzz'],
            });
