---
# Delegates to the shared definition in 4cloudguru/shared-workflows.
#
# This was a local 77-line copy. There were SIX copies across the estate, all
# byte-identical except one word in a comment -- and the odd one was correct:
# it named cloud-suite-ui, the repo that exists, while five named
# terraform-suite-ui, which does not. A stale name propagating by copy was the
# entire variation.
#
# Triggers and concurrency stay HERE deliberately: they read
# `github.event_name` and `github.head_ref`, and keeping them visible is what
# makes it obvious this lint actually runs in this repository.
#
# PINNED BY SHA. Repos sitting on different pins is the same drift wearing a
# new hat, and harder to see than divergent files -- every repo looks like it
# is using "the shared one". The pin-parity signature is what enforces that.
name: Workflow Security

"on":
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: zizmor-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  workflow-security:
    uses: 4cloudguru/shared-workflows/.github/workflows/workflow-security.yml@3aae0966a70daa50bcfe741ef07e20e86c814af4 # v1.20.2

  # Second gate, same family: zizmor audits workflow SECURITY, this audits
  # workflow HARDENING -- pins labelled, jobs bounded by a timeout,
  # harden-runner first, npm installs refusing dependency scripts.
  #
  # It lived in exactly ONE of the fourteen repos until now, and caught a real
  # defect the moment a shared-workflow pin reached it.
  #
  # script-ref MUST equal the pin above it: the checker is taken from
  # shared-workflows at that commit, so this repo cannot weaken its own gate by
  # editing a local copy -- there is no local copy.
  workflow-hardening:
    uses: 4cloudguru/shared-workflows/.github/workflows/workflow-hardening.yml@3aae0966a70daa50bcfe741ef07e20e86c814af4 # v1.20.2
    with:
      script-ref: 3aae0966a70daa50bcfe741ef07e20e86c814af4