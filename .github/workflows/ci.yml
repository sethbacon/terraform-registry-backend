name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}
  workflow_call:
    secrets:
      GIST_TOKEN:
        # The only secret ci.yml references (GITHUB_TOKEN is ambient, not passed).
        # Optional: the coverage-badge steps are env-guarded, so a repo without
        # it simply skips them rather than failing.
        required: false

concurrency:
  group: ci-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  backend-test:
    name: Backend Tests & Quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # contents:read only — this job installs untrusted third-party packages
    # (golangci-lint via `go install`, swag, npm ci for swagger2openapi) and
    # must never hold a write-capable token while doing so (#656). Committing
    # the regenerated swagger docs is handled by the isolated
    # swagger-docs-sync job below, which runs no package installs at all.
    permissions:
      contents: read
    steps:
      # hardening-exception: egress-audit — this job installs from the npm registry,
      #   downloads Go modules and tools from the module proxy, and transfers
      #   artifacts through the Actions API; harden-runner has never run in this
      #   repository, so no endpoint baseline exists and a block policy written
      #   without one fails closed on its first run; audit is what produces that list
      - name: Harden the runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go toolchain
        uses: ./.github/actions/setup-backend

      - name: Check go mod tidy
        working-directory: backend
        run: |
          go mod tidy
          if ! git diff --exit-code go.mod go.sum; then
            echo "go.mod or go.sum is out of date — run 'go mod tidy' and commit the result"
            exit 1
          fi

      - name: Build
        working-directory: backend
        run: go build ./...

      - name: Vet
        working-directory: backend
        run: go vet ./...

      # Installs split out from the steps that use them so they can be retried:
      # `go install` reaches the module proxy for the tool AND its whole
      # dependency tree on every run, uncovered by the module cache keyed on this
      # repo's go.sum. One transient read took a required check red in
      # terraform-state-manager-backend on a PR with no Go changes.
      - name: Install golangci-lint
        uses: 4cloudguru/shared-workflows/.github/actions/go-install@bc0eaaec5d6f5cf632ef862ff7475da928e32466 # v1.2.0
        with:
          package: github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2

      - name: Lint
        run: |
          cd backend
          golangci-lint run ./...

      # The bespoke GOBIN + GITHUB_PATH dance is gone with this: the action
      # installs to $(go env GOPATH)/bin, which actions/setup-go already places
      # on PATH -- the govulncheck step in weekly-security.yml has relied on
      # exactly that in this repository for as long as it has existed. Dropping
      # it also removes a write to an environment file, which is a code-execution
      # vector zizmor flags on principle.
      - name: Install swag
        uses: 4cloudguru/shared-workflows/.github/actions/go-install@bc0eaaec5d6f5cf632ef862ff7475da928e32466 # v1.2.0
        with:
          package: github.com/swaggo/swag/cmd/swag@v1.16.6

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Install docs tooling (swagger2openapi)
        # --ignore-scripts: npm runs dependency preinstall/install/postinstall
        # hooks by default, which is arbitrary code from the dependency tree
        # executing in a job this file's own header calls out as installing
        # untrusted third-party packages. Verified rather than assumed: nothing
        # in the tree declares an install script, and swagger2openapi still runs.
        run: npm ci --ignore-scripts

      - name: Swagger generation
        # Regenerates docs/swagger.json and docs/openapi3.json so drift against
        # the API annotations can be detected. This step only ever needs read
        # access to the checkout — landing the regenerated docs (if changed)
        # is handled by the isolated swagger-docs-sync job below, which holds
        # the only contents:write token and runs no package installs (#656).
        working-directory: backend
        run: |
          # On tag refs (release builds) skip swagger regeneration — it was
          # already checked when the release PR CI ran. Tags are immutable so
          # we cannot land doc updates against them anyway.
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "Running on tag ${GITHUB_REF_NAME} — skipping swagger regeneration"
            exit 0
          fi

          swag init -g cmd/server/main.go --outputTypes json
          # Convert Swagger 2.0 -> OpenAPI 3 for downstream consumers (frontend
          # typegen, terraform-provider-registry oapi-codegen). swag itself only
          # emits Swagger 2.0; this conversion keeps both files in lockstep.
          # swagger2openapi is pinned in the repo-root package.json/package-lock.json
          # (installed via the "Install docs tooling" step above); node_modules lives
          # at the repo root, one level up from this backend/ working directory.
          ../node_modules/.bin/swagger2openapi docs/swagger.json -o docs/openapi3.json -p

      - name: Upload generated Swagger/OpenAPI docs
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: swagger-docs
          path: |
            backend/docs/swagger.json
            backend/docs/openapi3.json
          retention-days: 1

      - name: Run Go tests (with coverage)
        working-directory: backend
        run: |
          go clean -testcache
          go test ./internal/... ./pkg/... -race -coverprofile=coverage.out -covermode=atomic

      - name: Filter integration-only functions from coverage
        working-directory: backend
        # Functions whose doc comment contains a `coverage:skip:` marker are
        # excluded from the unit-test coverage denominator. Such functions
        # require a live external dependency (DB, SCM, OIDC issuer, scanner,
        # upstream HTTP registry) to exercise and are covered by the
        # integration suite in cmd/api-test / docker-compose.test.yml.
        run:
          go run ./scripts/coverfilter -in coverage.out -out coverage.filtered.out
          -root .

      - name: Check coverage threshold
        working-directory: backend
        # Coverage targets follow a risk-based approach (Google / Graphite benchmarks):
        #   - Security & core business logic (auth, middleware, repositories): target 85-95%
        #   - APIs & handlers: target 75-85%
        #   - Utilities & helpers: target 70-80%
        #   - Overall floor: 80% (target 85% by Phase 5 / H5.2 milestone)
        # The threshold below is the hard CI floor; the build fails if coverage drops below it.
        run: |
          THRESHOLD=80
          COVERAGE=$(go tool cover -func=coverage.filtered.out | grep "^total:" | awk '{print $3}' | tr -d '%')
          echo "Coverage (filtered): ${COVERAGE}%  (threshold: ${THRESHOLD}%)"
          awk -v cov="$COVERAGE" -v thr="$THRESHOLD" 'BEGIN {
            if (cov + 0 < thr + 0) {
              print "FAIL: " cov "% is below the " thr "% minimum threshold."
              print "See docs/development.md for coverage guidelines and improvement targets."
              exit 1
            }
            print "PASS: " cov "% meets the " thr "% threshold."
          }'

      - name: Per-package coverage check
        run: |
          cd backend
          chmod +x scripts/check_package_coverage.sh
          ./scripts/check_package_coverage.sh

      - name: "List coverage:skip: markers (informational)"
        # Non-gating — coverage:skip: excludes a function from the unit-test coverage
        # denominator with no automated check that the exclusion is genuine. This
        # publishes the full list to the job summary each run so growth in the
        # exclusion list is visible for periodic manual review (issue #566 [51]).
        working-directory: backend
        run: |
          {
            echo "## coverage:skip: marked functions"
            echo ""
            echo '```'
            go run ./scripts/coverfilter -list -root .
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Go coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: go-coverage
          path: backend/coverage.out

      - name: Compute coverage badge inputs
        # Only update the badge on pushes to main — not on PRs.
        if: github.event_name == 'push'
        id: badge
        working-directory: backend
        run: |
          COVERAGE=$(go tool cover -func=coverage.filtered.out | grep "^total:" | awk '{print $3}' | tr -d '%')
          echo "percent=${COVERAGE}" >> $GITHUB_OUTPUT
          if awk "BEGIN {exit !(${COVERAGE} >= 85)}"; then
            echo "color=brightgreen" >> $GITHUB_OUTPUT
          elif awk "BEGIN {exit !(${COVERAGE} >= 70)}"; then
            echo "color=green" >> $GITHUB_OUTPUT
          elif awk "BEGIN {exit !(${COVERAGE} >= 60)}"; then
            echo "color=yellow" >> $GITHUB_OUTPUT
          else
            echo "color=red" >> $GITHUB_OUTPUT
          fi

      - name: Update coverage badge gist
        # Requires:
        #   secrets.GIST_TOKEN  — GitHub PAT with the 'gist' scope
        #   vars.COVERAGE_GIST_ID — ID of a pre-created public gist (any file in it will do)
        # Once set, the action writes / overwrites 'coverage.json' in that gist, which the
        # shields.io endpoint badge in README.md reads.
        if: github.event_name == 'push'
        uses: schneegans/dynamic-badges-action@28b0fa8bdeb46170ac397105ece0c1fe58f68910 # v1.9.0
        with:
          auth: ${{ secrets.GIST_TOKEN }}
          gistID: ${{ vars.COVERAGE_GIST_ID }}
          filename: coverage.json
          label: Coverage
          message: ${{ steps.badge.outputs.percent }}%
          color: ${{ steps.badge.outputs.color }}

  # ── Postgres-backed tests (issue #886) ────────────────
  # Twelve test files in backend/ read TFR_TEST_DATABASE_URL and t.Skip when it
  # is unset. Until this job existed NO workflow set it, so every guarantee they
  # prove -- the platform-admin carrier, the audit outbox's deferred constraint
  # trigger, migration round-trips, the member-role equivalence proof that gated
  # a BREAKING authorization change -- was verified only on developer machines.
  # Several of them say so in their own header comments.
  #
  # This job carries its own anti-false-green check, because the failure mode it
  # is fixing is precisely a green result that proved nothing: if the DSN were
  # wrong or the service unreachable, every one of these tests would SKIP and
  # the job would pass. `go test` exits 0 on a suite that skipped everything.
  postgres-tests:
    name: Postgres-backed tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        # Without a health check the job races the container and the tests skip
        # on an unreachable DSN -- green, and meaningless.
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      # hardening-exception: egress-audit — this job downloads Go modules and tools
      #   from the module proxy and clones this repository; harden-runner has never
      #   run in this repository, so no endpoint baseline exists and a block policy
      #   written without one fails closed on its first run; audit is what produces
      #   that list
      - name: Harden the runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go toolchain
        uses: ./.github/actions/setup-backend

      - name: Run the Postgres-backed tests
        working-directory: backend
        env:
          # This repo has NO build tags; the gate is this variable plus t.Skip.
          TFR_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
        # Deliberately NO -run filter. A name filter that matches nothing exits
        # 0 and reports "ok" per package, which is the same false green this
        # job exists to remove -- and it is easy to get wrong, since the twelve
        # files share no naming convention. Running the whole set costs a few
        # minutes and cannot silently select zero tests.
        run: go test ./internal/... -v 2>&1 | tee /tmp/pg-tests.log

      - name: Fail if the Postgres tests skipped
        run: |
          # The guard on the guard. A skipped suite and a passing suite are the
          # same exit code, so assert on the transcript instead: no test may
          # skip citing the DSN, and at least one must actually have run.
          if grep -q 'TFR_TEST_DATABASE_URL not set' /tmp/pg-tests.log; then
            echo "::error::Postgres tests SKIPPED on an unset DSN -- this job proved nothing."
            grep -n 'TFR_TEST_DATABASE_URL not set' /tmp/pg-tests.log | head -5
            exit 1
          fi
          if grep -qE 'TFR_TEST_DATABASE_URL is not reachable|not reachable' /tmp/pg-tests.log; then
            echo "::error::Postgres tests SKIPPED on an unreachable DSN -- this job proved nothing."
            exit 1
          fi
          passed=$(grep -c '^--- PASS' /tmp/pg-tests.log || true)
          echo "Postgres-backed tests passed: $passed"
          if [ "$passed" -lt 1 ]; then
            echo "::error::No Postgres-backed test ran. An empty universe is not a clean one."
            exit 1
          fi

  swagger-docs-sync:
    name: Sync generated Swagger/OpenAPI docs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: backend-test
    if: github.ref_type != 'tag'
    # Isolated from backend-test's build/lint/npm steps so the token needed
    # to land regenerated docs is never live alongside untrusted third-party
    # package installs (#656). This job runs no package manager at all — it
    # only downloads the docs backend-test already generated under a
    # contents:read token and commits/PRs them.
    permissions:
      contents: write
      pull-requests: write # only used for the bot-PR path below (#657)
    steps:
      # hardening-exception: egress-audit — this job transfers artifacts through the
      #   Actions API and clones this repository; harden-runner has never run in this
      #   repository, so no endpoint baseline exists and a block policy written
      #   without one fails closed on its first run; audit is what produces that list
      - name: Harden the runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 # zizmor: ignore[artipacked] -- pushes regenerated swagger docs to the PR head branch

      - name: Download generated docs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: swagger-docs
          path: backend/docs

      - name: Check for changes
        id: diff
        run: |
          if git diff --exit-code backend/docs/swagger.json backend/docs/openapi3.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Determine target branch
        id: target
        # Same derivation the auto-commit step always used: GITHUB_HEAD_REF is
        # set for pull_request events (the PR's own head branch);
        # GITHUB_REF_NAME is used otherwise (push/workflow_dispatch/schedule,
        # all of which run against main — see the `on:` triggers).
        run: echo "branch=${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Commit docs directly to PR branch
        # A non-main target branch is an open PR's own head branch, which
        # still requires review + status checks before it can reach main, so
        # a direct push here is safe — it just keeps that PR's docs in sync.
        #
        # This commit deliberately carries NO `[skip ci]` marker. It used to.
        # `[skip ci]` suppresses the workflow run for the SHA it lands on, and
        # branch protection evaluates required contexts against the PR's HEAD —
        # so the push moved the head to a commit that would never report any
        # check, and the PR sat BLOCKED with nothing failing and nothing to
        # re-run. Silent, and indistinguishable from "still waiting for CI".
        #
        # Without the marker the push re-runs CI once. That run regenerates the
        # same docs, the diff step finds no change, and no second commit is
        # made — so it terminates after exactly one extra run, and only on PRs
        # whose docs actually drifted. The convergence check below turns the
        # one shape that would NOT terminate — a generator whose output is not
        # byte-stable — into a loud failure instead of a commit loop.
        if: steps.diff.outputs.changed == 'true' && steps.target.outputs.branch != 'main'
        run: |
          set -euo pipefail
          TARGET_BRANCH="${STEPS_TARGET_OUTPUTS_BRANCH}"
          # Fetch and rebase before pushing so concurrent commits to the same branch
          # (e.g. two PR squash-merges landing seconds apart) don't cause a rejected push.
          git fetch origin "${TARGET_BRANCH}"

          if [ "$(git log -1 --format=%s "origin/${TARGET_BRANCH}")" = "${DOCS_COMMIT_SUBJECT}" ]; then
            echo "::error::Swagger regeneration is not converging: the previous commit on ${TARGET_BRANCH} was already a regeneration and the docs still differ. That means \`swag init\` output is not byte-stable, so committing again would loop. Fix the generator (or pin its version) rather than re-running."
            git --no-pager diff --stat backend/docs/swagger.json backend/docs/openapi3.json
            exit 1
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backend/docs/swagger.json backend/docs/openapi3.json
          git commit -m "${DOCS_COMMIT_SUBJECT}"
          git rebase "origin/${TARGET_BRANCH}"
          git push origin "HEAD:refs/heads/${TARGET_BRANCH}"
        env:
          DOCS_COMMIT_SUBJECT: "chore: regenerate swagger.json and openapi3.json"
          STEPS_TARGET_OUTPUTS_BRANCH: ${{ steps.target.outputs.branch }}

      - name: Open pull request for doc regeneration onto main
        # Anything that would otherwise write straight onto the protected
        # main branch — a direct push, workflow_dispatch, or the scheduled
        # weekly run — goes through a bot-authored PR instead of a direct
        # push, so normal review and required status checks always apply
        # before regenerated docs reach main (#657).
        if: steps.diff.outputs.changed == 'true' && steps.target.outputs.branch == 'main'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          base: main
          commit-message: "chore: regenerate swagger.json and openapi3.json"
          title: "chore: regenerate swagger.json and openapi3.json"
          body: >
            Auto-generated by the backend-test CI job — the committed
            OpenAPI/Swagger docs drifted from the API annotations.
          branch: ci/swagger-docs-sync
          add-paths: |
            backend/docs/swagger.json
            backend/docs/openapi3.json
          delete-branch: true

  security-tooling-tests:
    name: Security tooling unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # backend/scripts/ holds the two programs that decide whether a security
    # finding blocks a merge: gosec_compare.py (new-vs-baseline) and
    # osv_triage.py (fixable-vs-unfixable). Both shipped with unit tests that
    # NO workflow ran, so a regression in either would have surfaced as a
    # security gate quietly reporting the wrong answer.
    permissions:
      contents: read
    steps:
      # hardening-exception: egress-audit — this job clones this repository;
      #   harden-runner has never run in this repository, so no endpoint baseline
      #   exists and a block policy written without one fails closed on its first run;
      #   audit is what produces that list
      - name: Harden the runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run the security-tooling unit tests
        working-directory: backend
        run: |
          set -euo pipefail
          # Discovery rather than a hard-coded list: a new *_test.py added to
          # scripts/ is picked up without editing this workflow, which is how
          # the existing two came to be unrun.
          found=$(find scripts -name '*_test.py' | sort)
          if [ -z "$found" ]; then
            echo "::error::no *_test.py found under backend/scripts — this job is not testing anything"
            exit 1
          fi
          echo "$found"
          for t in $found; do
            echo "::group::$t"
            python3 "$t"
            echo "::endgroup::"
          done

  gosec:
    name: Security Scan (gosec)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Run in parallel with backend-test — no dependency needed.
    # Needs issues:write to open a GitHub issue when new findings are detected.
    permissions:
      contents: read
      issues: write
    steps:
      # hardening-exception: egress-audit — this job transfers artifacts through the
      #   Actions API, calls the GitHub API, and clones this repository; harden-runner
      #   has never run in this repository, so no endpoint baseline exists and a block
      #   policy written without one fails closed on its first run; audit is what
      #   produces that list
      - name: Harden the runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go toolchain
        uses: ./.github/actions/setup-backend
        with:
          install-gosec: "true"

      - name: Run gosec
        working-directory: backend
        # No -exclude flags: false positives and accepted risks are suppressed inline
        # with // #nosec <rule> -- <justification> annotations (see gosec-report.md).
        # gosec exits non-zero when findings exist; we capture that via the compare step.
        run: gosec -fmt json -out gosec-results.json ./... || true

      # The comparator is the only thing standing between a gosec run and a green

      # required check, and its own regression tests were committed but never

      # executed by anything -- CI ran no python tests at all. A test nothing

      # runs is indistinguishable from a test that passes.

      - name: The gosec comparator's own tests

        working-directory: backend

        run: python3 scripts/gosec_compare_test.py


      - name: Compare against baseline
        id: compare
        working-directory: backend
        # Exits 0 → no new findings. Exits 1 → new findings; issue body written to /tmp/issue-body.md.
        run: |
          python3 scripts/gosec-compare.py \
            --results  gosec-results.json \
            --baseline gosec-baseline.json \
            --base-dir . \
            --output   /tmp/issue-body.md
        continue-on-error: true

      - name: Open GitHub issue for new findings
        if: steps.compare.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Ensure labels exist (idempotent — --force updates if already present).
          gh label create "security"  --color "d73a4a" --description "Security finding"          --repo "$GITHUB_REPOSITORY" --force || true
          gh label create "automated" --color "0075ca" --description "Created automatically by CI" --repo "$GITHUB_REPOSITORY" --force || true

          TITLE="security: new gosec findings on ${GITHUB_REF_NAME} ($(date -u +%Y-%m-%d))"
          # Avoid duplicate open issues for the same branch/day.
          EXISTING=$(gh issue list \
            --repo "$GITHUB_REPOSITORY" \
            --state open \
            --label "security,automated" \
            --search "gosec ${GITHUB_REF_NAME}" \
            --json number \
            --jq length)
          if [ "$EXISTING" -gt 0 ]; then
            echo "An open gosec issue already exists for this branch — skipping duplicate creation."
            exit 0
          fi
          gh issue create \
            --repo  "$GITHUB_REPOSITORY" \
            --title "$TITLE" \
            --body-file /tmp/issue-body.md \
            --label "security,automated"

      - name: Fail job if new findings detected
        if: steps.compare.outcome == 'failure'
        run: |
          echo "New gosec findings detected — see the GitHub issue created above."
          echo "Fix or suppress findings with // #nosec <rule> -- <reason>, then update gosec-baseline.json:"
          echo "  bash backend/scripts/update-gosec-baseline.sh"
          exit 1

      - name: Upload gosec results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gosec-results
          path: backend/gosec-results.json

  docker-build:
    name: Docker Build Smoke Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      # hardening-exception: egress-audit — this job pulls base images and pushes
      #   layers to a container registry and clones this repository; harden-runner has
      #   never run in this repository, so no endpoint baseline exists and a block
      #   policy written without one fails closed on its first run; audit is what
      #   produces that list
      - name: Harden the runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build backend Docker image
        run: docker build -t terraform-registry-backend:ci backend/

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: backend/
          severity: HIGH,CRITICAL
          # Only fail on vulnerabilities that have a fix available; un-actionable
          # (no-fix-yet) CVEs shouldn't block CI.
          ignore-unfixed: true
          exit-code: 1
          format: table

      - name: Verify image starts (health check smoke test)
        run: |
          # Start the container with DEV_MODE so it doesn't require a live database for the health probe.
          docker run -d \
            --name registry-smoke \
            -e DEV_MODE=true \
            -e TFR_DATABASE_HOST=nonexistent \
            -p 18080:8080 \
            terraform-registry-backend:ci || true
          # Give it 5 seconds and check it didn't immediately crash.
          sleep 5
          STATUS=$(docker inspect --format='{{.State.Status}}' registry-smoke 2>/dev/null || echo "missing")
          echo "Container status: $STATUS"
          docker rm -f registry-smoke 2>/dev/null || true
          # Container exits fast (can't connect to DB) — that is expected; we just want build
          # to succeed, not crash at process startup. Status "exited" is acceptable here.
          if [ "$STATUS" = "missing" ]; then
            echo "Container never started — Docker build artifact broken"
            exit 1
          fi

  deployment-validate:
    name: Deployment Config Validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      # hardening-exception: egress-audit — this job fetches charts and schemas from
      #   remote sources and clones this repository; harden-runner has never run in
      #   this repository, so no endpoint baseline exists and a block policy written
      #   without one fails closed on its first run; audit is what produces that list
      - name: Harden the runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate Docker Compose configs
        working-directory: deployments
        # REGISTRY_TAG is required (no default — #680); set a placeholder so
        # config validation doesn't require a real pinned release version.
        env:
          REGISTRY_TAG: ci-validate-placeholder
        run: |
          # docker-compose.prod.yml requires .env.production to exist (env_file directive).
          # Touch a stub so compose config doesn't fail on a missing file.
          touch .env.production
          docker compose -f docker-compose.yml config --quiet
          docker compose -f docker-compose.yml -f docker-compose.prod.yml config --quiet
          docker compose -f docker-compose.test.yml config --quiet

      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: "latest"

      - name: Helm lint
        run: |
          helm lint deployments/helm/ \
            --set config.baseUrl=https://registry.example.com \
            --set config.jwtSecret=aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa \
            --set config.databasePassword=password \
            --set config.encryptionKey=00000000000000000000000000000000

      - name: CSP nonce guard (frontend header == <meta>)
        # Renders the frontend nginx ConfigMap, serves it with nginx, and asserts
        # the CSP response-header nonce equals the served <meta> nonce — guarding
        # the regression that rendered the SPA unstyled under the strict CSP.
        run: bash deployments/helm/verify-csp-nonce.sh

      - name: Kustomize validate (dev overlay)
        run: kubectl kustomize deployments/kubernetes/overlays/dev > /dev/null

      - name: Kustomize validate (production overlay)
        run: kubectl kustomize deployments/kubernetes/overlays/production > /dev/null

      - name: Install Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: latest

      - name: Terraform validate (AWS)
        working-directory: deployments/terraform/aws
        run: terraform init -backend=false && terraform validate

      - name: Terraform validate (Azure)
        working-directory: deployments/terraform/azure
        run: terraform init -backend=false && terraform validate

      - name: Terraform validate (GCP)
        working-directory: deployments/terraform/gcp
        run: terraform init -backend=false && terraform validate

  # ── CodeQL Analysis ───────────────────────────────────────────────────────
  # Runs on every PR and push to main (not just the weekly schedule in
  # weekly-security.yml) so vulnerable code can't reach main unscanned for up
  # to a week; the weekly run remains as a defense-in-depth backstop.
  codeql:
    name: CodeQL Analysis (Go)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      # hardening-exception: egress-audit — this job downloads the CodeQL bundle and
      #   its query packs, downloads Go modules and tools from the module proxy, and
      #   clones this repository; harden-runner has never run in this repository, so
      #   no endpoint baseline exists and a block policy written without one fails
      #   closed on its first run; audit is what produces that list
      - name: Harden the runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go toolchain
        uses: ./.github/actions/setup-backend

      - name: Initialize CodeQL
        uses: github/codeql-action/init@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          languages: go

      - name: Build for CodeQL
        working-directory: backend
        run: go build ./...

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          category: /language:go
